services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./trinetra.db
      - CWD=/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trinetra_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
