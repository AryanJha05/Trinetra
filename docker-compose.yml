services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./visionguard.db
      - CWD=/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
